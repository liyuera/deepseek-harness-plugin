<!doctype html>
<!--
  Every reason a click may not land, on one page, so `chrome_click`'s warnings
  can be checked against a real browser: natively disabled, zero-size, hidden,
  off-viewport, covered, aria-disabled, and one that is simply fine.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>可点性探针</title>
    <style>
      body { font: 14px system-ui; margin: 2rem; display: grid; gap: .5rem; max-width: 40rem }
      .row { position: relative; }
      #overlay { position: absolute; inset: 0; background: #0002; z-index: 2 }
      #zero { width: 0; height: 0; overflow: hidden; border: 0; padding: 0 }
      #hidden { display: none }
      #offscreen { position: absolute; left: -9999px; top: 0 }
    </style>
  </head>
  <body>
    <h1>可点性探针</h1>
    <button id="ok">正常</button>
    <button id="disabled" disabled>原生 disabled</button>
    <button id="aria" aria-disabled="true">aria-disabled</button>
    <div class="row"><button id="covered">被遮挡</button><div id="overlay"></div></div>
    <button id="zero">零尺寸</button>
    <button id="hidden">隐藏</button>
    <button id="offscreen">视口外</button>
    <div id="out">idle</div>
    <script>document.getElementById('ok').addEventListener('click', () => { document.getElementById('out').textContent = 'ok-clicked' })</script>
  </body>
</html>
