  /* 仅为了验收截图：把 fixed dialog 放进 stage，位置/尺寸/颜色不变 */
  .mrl-dialog{position:absolute !important;top:24px !important;right:24px !important}
  #chip-box{position:absolute;top:24px;left:24px;right:500px}
</style>
<script>

  <div id="chip-box"></div>
  <!-- cramped 演示：把 chip 塞进 200px 的裁剪行里，应该自动收成图标（真实测量路径） -->

<script>
  // 客户端把弹层 portal 到 document.body；验收台把目标改到 #stage，
  // 这样截图只截 stage 也能把弹层框进去（位置/尺寸/颜色不变）。
  (function () {
    var createPortal = window.ReactDOM.createPortal;
    window.ReactDOM.createPortal = function (node, container) {
      return createPortal(node, container === document.body ? document.getElementById('stage') : container);
    };
  })();
</script>

<script src="../lib/client.js"></script>
<script>
  const captured = []
  const ctx = {
    slots: {
      inject: function (_name, cb) { cb() },
      register: function (def, Comp) { captured.push({ def: def, Comp: Comp }); return function () {} },
    },
    effect: function (f) { const d = f(); return d },
  }
  window.__client.apply(ctx)

  const chip = captured.find(c => c.def.name === 'conversation.session.header.actions').Comp
  const drawer = captured.find(c => c.def.name === 'shell.overlay').Comp

  const React = window.React
  const ReactDOM = window.ReactDOM
  // ?chip=compact 演示「窄屏收成一个 MR 图标」：整个页面当成窄屏，只挂 chip。
  const chipDemo = new URLSearchParams(location.search).get('chip')
  if (chipDemo === 'cramped') {
    // 真实测量路径：容器只有 200px，chip 会自己量出「放不下」→ 收成图标。
    ReactDOM.createRoot(document.getElementById('chip-cramped-row')).render(React.createElement(chip, { sessionId: 'session-1' }))
  } else if (chipDemo === 'compact') {
    Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return 900 } })
    ReactDOM.createRoot(document.getElementById('chip-box')).render(React.createElement(chip, { sessionId: 'session-1' }))
  } else {
    ReactDOM.createRoot(document.getElementById('chip-box')).render(React.createElement(chip, { sessionId: 'session-1' }))
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(drawer))
    // 等 fetch 落定后点开看板
    setTimeout(function () {
      const buttons = Array.from(document.querySelectorAll('button'))
      const open = buttons.find(b => b.textContent.trim() === '看板')
      if (open) open.click()
    }, 300)
  }
</script>
