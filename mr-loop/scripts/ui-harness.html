<script src="../lib/client.js"></script>
<script>
  const captured = []
  const ctx = {
    slots: {
      inject: function (_name, cb) { cb() },
      register: function (def, Comp) { captured.push({ def: def, Comp: Comp }); return function () {} },
    },
    effect: function (f) { const d = f(); return d },
  }
  window.__client.apply(ctx)

  const chip = captured.find(c => c.def.name === 'conversation.session.header.actions').Comp
  const drawer = captured.find(c => c.def.name === 'shell.overlay').Comp

  const React = window.React
  const ReactDOM = window.ReactDOM
  ReactDOM.createRoot(document.getElementById('chip-box')).render(React.createElement(chip, { sessionId: 'session-1' }))
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(drawer))

  // 等 fetch 落定后点开看板
  setTimeout(function () {
    const buttons = Array.from(document.querySelectorAll('button'))
    const open = buttons.find(b => b.textContent.trim() === '看板')
    if (open) open.click()
  }, 300)
