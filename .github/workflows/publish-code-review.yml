# Publish code-review to npm with Trusted Publishing (OIDC).
#
# Bootstrap note: npm does not allow a Trusted Publisher to be configured for a
# package that does not exist yet, so the *first* release (0.1.0) was published
# manually with a granular token. Once 0.1.0 exists, add the trusted publisher
# on npmjs.com: package Settings -> Trusted Publisher -> GitHub Actions, with:
#   Organization/user:  liyuera
#   Repository:         deepseek-harness-plugin
#   Workflow filename:  publish-code-review.yml
#   Allowed actions:    npm publish  (new configurations default to stage-only)
# After that, set Publishing access to "Require 2FA or trusted publisher,
# disallow tokens" so long-lived tokens cannot publish this package.
#
# Release flow: bump code-review/package.json, commit, push, then push a tag
# named `code-review-v<version>`. Nothing needs an NPM_TOKEN secret.
name: Publish code-review

on:
  push:
    tags:
      - 'code-review-v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-review
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Node 24's bundled npm may predate Trusted Publishing support (11.5.1).
      - run: npm install -g npm@latest
      - name: Check the tag matches the package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#code-review-v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$version" ]; then
            echo "tag code-review-v$tag does not match package version $version" >&2
            exit 1
          fi
          echo "publishing $version"
      - run: npm publish --access public
